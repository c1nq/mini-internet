name: mini-internet

topology:
  defaults:
    kind: linux
  nodes:
    transit:
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/transit/frr.conf:/etc/frr/frr.conf
    bank:
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/bank/frr.conf:/etc/frr/frr.conf
    aanvaller:
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/aanvaller/frr.conf:/etc/frr/frr.conf
    klant:
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/klant/frr.conf:/etc/frr/frr.conf
    web-bank:
      image: nginx:alpine
      network-mode: container:bank
      binds:
        - web/bank:/usr/share/nginx/html:ro
    web-aanvaller:
      image: nginx:alpine
      network-mode: container:aanvaller
      binds:
        - web/aanvaller:/usr/share/nginx/html:ro
  links:
    - endpoints: ["transit:eth1", "bank:eth1"]
    - endpoints: ["transit:eth2", "aanvaller:eth1"]
    - endpoints: ["transit:eth3", "klant:eth1"]
