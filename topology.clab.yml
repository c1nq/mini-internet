name: mini-internet

topology:
  defaults:
    kind: linux
  nodes:
    transit:
      image: frr-debian-rpki:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/transit/frr.conf:/etc/frr/frr.conf
    bank:
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/bank/frr.conf:/etc/frr/frr.conf
    aanvaller:
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/aanvaller/frr.conf:/etc/frr/frr.conf
    klant:
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/klant/frr.conf:/etc/frr/frr.conf
    web-bank:
      image: nginx:alpine
      network-mode: container:bank
      binds:
        - web/bank:/usr/share/nginx/html
    web-aanvaller:
      image: nginx:alpine
      network-mode: container:aanvaller
      binds:
        - web/aanvaller:/usr/share/nginx/html
    ca:
      image: smallstep/step-ca:0.27.2
      network-mode: container:klant
      binds:
        - configs/ca:/home/step
      env:
        DOCKER_STEPCA_INIT_NAME: "Lab CA"
        DOCKER_STEPCA_INIT_DNS_NAMES: "ca.lab,10.4.0.1"
        DOCKER_STEPCA_INIT_ACME: "true"
    routinator:
      image: nlnetlabs/routinator:v0.13.2
      network-mode: container:transit
      binds:
        - configs/routinator/tals-leeg:/home/routinator/.rpki-cache/tals
        - configs/routinator/repo:/home/routinator/.rpki-cache/repository
        - configs/routinator/exceptions.json:/home/routinator/exceptions.json:ro
      cmd: --no-rir-tals -x /home/routinator/exceptions.json server --rtr 0.0.0.0:3323
  links:
    - endpoints: ["transit:eth1", "bank:eth1"]
    - endpoints: ["transit:eth2", "aanvaller:eth1"]
    - endpoints: ["transit:eth3", "klant:eth1"]
