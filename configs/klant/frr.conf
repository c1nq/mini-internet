hostname klant
!
interface lo
 ip address 10.4.0.1/24
!
interface eth1
 ip address 10.255.14.2/30
!
route-map BRON permit 10
 set src 10.4.0.1
!
ip protocol bgp route-map BRON
!
router bgp 65004
 bgp router-id 10.4.0.1
 no bgp ebgp-requires-policy
 neighbor 10.255.14.1 remote-as 65001
 address-family ipv4 unicast
  network 10.4.0.0/24
 exit-address-family
!
