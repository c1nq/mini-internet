hostname transit
!
interface lo
 ip address 10.1.0.1/24
!
interface eth1
 ip address 10.255.12.1/30
!
interface eth2
 ip address 10.255.13.1/30
!
interface eth3
 ip address 10.255.14.1/30
!
router bgp 65001
 bgp router-id 10.1.0.1
 no bgp ebgp-requires-policy
 neighbor 10.255.12.2 remote-as 65002
 neighbor 10.255.13.2 remote-as 65003
 neighbor 10.255.14.2 remote-as 65004
 address-family ipv4 unicast
  network 10.1.0.0/24
  neighbor 10.255.12.2 route-map RPKI-IN in
  neighbor 10.255.12.2 soft-reconfiguration inbound
  neighbor 10.255.13.2 route-map RPKI-IN in
  neighbor 10.255.13.2 soft-reconfiguration inbound
  neighbor 10.255.14.2 route-map RPKI-IN in
  neighbor 10.255.14.2 soft-reconfiguration inbound
 exit-address-family
!
!
rpki
 rpki cache tcp 127.0.0.1 3323 preference 1
exit
!
route-map RPKI-IN deny 10
 match rpki invalid
!
route-map RPKI-IN permit 20
!
